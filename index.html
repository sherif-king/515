<!DOCTYPE html>

<body>

    <!-- شاشة الدخول -->

        <div class="video-background">

        <!-- البطاقة التعريفية -->

                    <i class="fab fa-snapchat-ghost"></i>
                    <span>x7x-99</span>
                </a>
                <a href="https://t.me/K_NN_P" target="_blank" class="social-btn telegram">
                    <i class="fab fa-telegram-plane"></i>
                    <span>K_NN_P</span>
                </a>
                <a href="https://www.tiktok.com/@nzse" target="_blank" class="social-btn tiktok">
                    <i class="fab fa-tiktok"></i>
                    <span>nzse</span>
                </a>
            </div>
        </div>

    </div>

    <!-- عنصر مخفي لتشغيل الأغنية -->
    <div id="yt-player-hidden" style="display:none;"></div>

    <script src="script.js"></script>
