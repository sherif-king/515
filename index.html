<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شريف | Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; background-color: #000; }
        
        #entry-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; justify-content: center; align-items: center; z-index: 9999; cursor: pointer; transition: opacity 1s ease; }
        #entry-screen.fade-out { opacity: 0; pointer-events: none; }
        .entry-content { text-align: center; animation: pulse 2s infinite; }
        .entry-content h2 { color: #fff; font-size: 3.5rem; font-weight: 900; margin-bottom: 15px; text-shadow: 0 0 20px rgba(255, 255, 255, 0.5); }
        .entry-content p { color: #aaa; font-size: 1.5rem; letter-spacing: 2px; }
        
        #main-content { position: absolute; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; opacity: 0; transition: opacity 1.5s ease; }
        #main-content.show { opacity: 1; }
        
        .video-background { position: absolute; top: 50%; left: 50%; min-width: 100%; min-height: 100%; width: auto; height: auto; transform: translate(-50%, -50%); z-index: -2; pointer-events: none; }
        .video-background iframe { width: 100vw; height: 56.25vw; min-height: 100vh; min-width: 177.77vh; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.65); z-index: -1; backdrop-filter: blur(2px); }
        
        .profile-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 25px; padding: 40px 30px; text-align: center; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5); width: 90%; max-width: 400px; animation: fadeIn 1.5s ease-out; z-index: 1; }
        .profile-image { position: relative; width: 130px; height: 130px; margin: 0 auto 20px; }
        .profile-image img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid rgba(255, 255, 255, 0.2); position: relative; z-index: 2; }
        
        .glow-ring { position: absolute; top: -5px; left: -5px; right: -5px; bottom: -5px; border-radius: 50%; background: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000); background-size: 400%; z-index: 1; animation: glowing 20s linear infinite; filter: blur(10px); opacity: 0.7; }
        
        .name { color: #fff; font-size: 2.5rem; font-weight: 900; margin-bottom: 10px; text-shadow: 0 0 10px rgba(255, 255, 255, 0.5); letter-spacing: 1px; }
        .bio { color: #ccc; font-size: 1.1rem; margin-bottom: 30px; font-weight: 400; }
        .social-links { display: flex; flex-direction: column; gap: 15px; }
        .social-btn { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px; border-radius: 12px; text-decoration: none; color: #fff; font-size: 1.1rem; font-weight: 700; transition: all 0.3s ease; border: 1px solid transparent; background: rgba(255, 255, 255, 0.05); }
        .social-btn i { font-size: 1.4rem; }
        
        .snapchat:hover { background: rgba(255, 252, 0, 0.2); border-color: #fffc00; box-shadow: 0 0 15px rgba(255, 252, 0, 0.4); transform: translateY(-3px); }
        .telegram:hover { background: rgba(0, 136, 204, 0.2); border-color: #0088cc; box-shadow: 0 0 15px rgba(0, 136, 204, 0.4); transform: translateY(-3px); }
        .tiktok:hover { background: rgba(255, 255, 255, 0.2); border-color: #fff; box-shadow: 0 0 15px rgba(255, 255, 255, 0.4); transform: translateY(-3px); }
        
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.7; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes glowing { 0% { background-position: 0 0; } 50% { background-position: 400% 0; } 100% { background-position: 0 0; } }
    </style>
</head>
<body>

    <div id="entry-screen">
        <div class="entry-content">
            <h2>ارحححب نورت</h2>
            <p>اضغط أي زر عشان تدخل</p>
        </div>
    </div>

    <div id="main-content" class="hidden">
        <div class="video-background">
            <iframe id="bg-video" src="" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
        <div class="overlay"></div>
        <div class="profile-card">
            <div class="profile-image">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcREFvJp9_QfSTX26FemE7iBbESq0k0WZe1pHnQ8R6kHBA&s=10" alt="شريف" id="profile-pic">
                <div class="glow-ring"></div>
            </div>
            <h1 class="name">شريف</h1>
            <p class="bio">شريف المعروف لا يعرف عندك اعتراض ؟</p>
            <div class="social-links">
                <a href="https://www.snapchat.com/add/x7x-99" target="_blank" class="social-btn snapchat"><i class="fab fa-snapchat-ghost"></i><span>x7x-99</span></a>
                <a href="https://t.me/K_NN_P" target="_blank" class="social-btn telegram"><i class="fab fa-telegram-plane"></i><span>K_NN_P</span></a>
                <a href="https://www.tiktok.com/@nzse" target="_blank" class="social-btn tiktok"><i class="fab fa-tiktok"></i><span>nzse</span></a>
            </div>
        </div>
    </div>

    <div id="yt-player-hidden" style="display:none;"></div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const entryScreen = document.getElementById("entry-screen");
            const mainContent = document.getElementById("main-content");
            const bgVideo = document.getElementById("bg-video");
            let youtubePlayer = null;
            let hasEntered = false;

            bgVideo.src = "https://www.youtube.com/embed/TYNTh7fp8Io?autoplay=1&mute=1&controls=0&loop=1&playlist=TYNTh7fp8Io&showinfo=0&rel=0&modestbranding=1";

            const tag = document.createElement('script');
            tag.src = "https://www.youtube.com/iframe_api";
            const firstScriptTag = document.getElementsByTagName('script')[0];
            firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

            window.onYouTubeIframeAPIReady = function() {
                // 🔥 تم تغيير رابط الأغنية هنا فقط
                youtubePlayer = new YT.Player('yt-player-hidden', {
                    height: '0', width: '0', videoId: 'FTHi7lyw3xU',
                    playerVars: { 'autoplay': 0, 'controls': 0, 'loop': 1, 'playlist': 'FTHi7lyw3xU' },
                    events: { 'onReady': (event) => { event.target.setVolume(70); } }
                });
            };

            const enterSite = () => {
                if (hasEntered) return;
                hasEntered = true;
                
                entryScreen.classList.add("fade-out");
                setTimeout(() => {
                    entryScreen.style.display = "none";
                    mainContent.classList.remove("hidden");
                    mainContent.classList.add("show");
                }, 800);

                if (youtubePlayer && typeof youtubePlayer.playVideo === 'function') {
                    youtubePlayer.playVideo();
                } else {
                    setTimeout(() => { if (youtubePlayer) youtubePlayer.playVideo(); }, 1000);
                }
                
                document.removeEventListener("click", enterSite);
                document.removeEventListener("keydown", enterSite);
                document.removeEventListener("touchstart", enterSite);
            };

            document.addEventListener("click", enterSite);
            document.addEventListener("keydown", enterSite);
            document.addEventListener("touchstart", enterSite);
        });
    </script>
</body>
</html>
